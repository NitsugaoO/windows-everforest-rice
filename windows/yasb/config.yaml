# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: true
      round_corners: false
    window_flags:
      # 不置顶(false)：其它窗口可以压在状态栏之上。
      # 顶部 34px 的避让仍由下面的 windows_app_bar(注册 AppBar)保证 ——
      # 最大化窗口会自动避开状态栏；只有无边框全屏/自绘全屏的窗口会盖住它。
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - glazewm_workspaces
      - glazewm_tiling_direction
      - taskbar
      center:
      - clock
      right:
      - obs_idle
      - obs_rec
      - wifi
      - volume
      - cpu
      - gpu
      - memory
      - battery
widgets:
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      # 日历弹窗已拆除（原来 on_left: toggle_calendar）；左键改为切换主/备标签
      callbacks:
        on_left: toggle_label
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span class='icon'>{icon}</span> {level}
      label_alt: <span class='icon'>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uF026"
        '10': "\uF027"
        '30': "\uF027"
        '60': "\uF028"
        '100': "\uF028"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  battery:
    type: yasb.battery.BatteryWidget
    options:
      label: "<span class='icon'>{icon}</span> {percent}%"
      label_alt: "<span class='icon'>{icon}</span> {percent}% | {time_remaining}"
      update_interval: 5000
      time_remaining_natural: false
      hide_unsupported: true
      status_thresholds:
        critical: 15
        low: 30
        medium: 60
        high: 90
        full: 100
      status_icons:
        icon_charging: "\uF0E7"
        icon_critical: "\uF244"
        icon_low: "\uF243"
        icon_medium: "\uF242"
        icon_high: "\uF241"
        icon_full: "\uF240"
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: false
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  wifi:
    type: yasb.status_icons.WifiIconWidget
    options:
      label: "<span class='icon'>{wifi_icon}</span>"
      label_alt: "<span class='icon'>{wifi_icon}</span> {wifi_name}"
      update_interval: 5000
      wifi_icons:
      - "\uF1EB"
      - "\uF1EB"
      - "\uF1EB"
      - "\uF1EB"
      - "\uF1EB"
      ethernet_icon: "\uF1EB"
      ethernet_label: "<span class='icon'>{wifi_icon}</span>"
      ethernet_label_alt: "<span class='icon'>{wifi_icon}</span> {wifi_name}"
      hide_if_ethernet: false
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  taskbar:
    type: yasb.taskbar.TaskbarWidget
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: true
      # 没有任何窗口、也没有固定应用时整个组件隐藏（否则会留一个空胶囊）
      hide_empty: true
      animation:
        enabled: true
      callbacks:
        on_left: toggle_window
        on_right: context_menu
  glazewm_workspaces:
    type: glazewm.workspaces.GlazewmWorkspacesWidget
    options:
      hide_if_offline: true
      monitor_exclusive: false
  glazewm_tiling_direction:
    type: glazewm.tiling_direction.GlazewmTilingDirectionWidget
    options:
      horizontal_label: "\u21C4"
      vertical_label: "\u21C5"
  cpu:
    type: yasb.status_icons.CpuIconWidget
    options:
      label: "<span class='icon'>\uF4BC</span> {info[percent][total]}%"
      label_alt: '{info[freq][current]} MHz'
      update_interval: 2000
      hide_decimal: true
      # 负载色阶：≤30 绿 / 30-60 黄 / 60-85 橙 / >85 红（CSS 见 yasb_styles.css）
      cpu_thresholds:
        low: 30
        medium: 60
        high: 85
      # 统计弹窗已拆除：menu.enabled 默认即 false，删掉整段就不会再创建 PopupWidget
      # 左键暂为无动作：label_alt 里的频率数据意义不大，等拿到 CPU 温度再重新启用 toggle_label
      callbacks:
        on_left: do_nothing
        on_middle: do_nothing
        on_right: toggle_label
  gpu:
    type: yasb.status_icons.GpuIconWidget
    options:
      label: "<span class='icon'>\uEABE</span> {info[utilization]}%"
      label_alt: "<span class='icon'>\uEABE</span> {info[temp]}°C | {info[mem_used]}/{info[mem_total]}"
      update_interval: 2000
      hide_decimal: true
      gpu_thresholds:
        low: 30
        medium: 60
        high: 85
      # 统计弹窗已拆除；左键暂为无动作（label_alt 里的显存/温度暂无价值）
      callbacks:
        on_left: do_nothing
        on_middle: do_nothing
        on_right: toggle_label
  memory:
    type: yasb.status_icons.MemoryIconWidget
    options:
      label: "<span class='icon'>\uEFC5</span> {virtual_mem_free}"
      label_alt: "<span class='icon'>\uEFC5</span> VIRT: {virtual_mem_percent}% SWAP: {swap_mem_percent}%"
      update_interval: 5000
      hide_decimal: true
      # 内存占用率色阶（阈值按 virtual_mem_percent 判定，标签显示的是剩余可用量）
      memory_thresholds:
        low: 60
        medium: 75
        high: 90
      # 统计弹窗已拆除；左键暂为无动作（label_alt 里的 VIRT/SWAP 暂无价值）
      callbacks:
        on_left: do_nothing
        on_middle: do_nothing
        on_right: toggle_label
  # --- OBS 录制状态（自定义组件，两个互斥显示）---
  # obs_idle：OBS 在跑但没录制时显示（灰色 IDLE）；左键 = 开始录制
  # obs_rec ：录制中显示 REC/PAUSE 计时（红底）；左键 = 暂停/恢复，右键 = 停止并打开录像目录
  # 二者都靠 obs_status.py 每秒查询 OBS WebSocket；**连不上 OBS 时自动隐藏**。
  obs_idle:
    type: yasb.custom.CustomWidget
    options:
      class_name: "obs-idle"
      label: "{data}"
      label_alt: "{data}"
      label_placeholder: ""
      tooltip: true
      tooltip_label: "点击开始录制"
      exec_options:
        run_cmd: "C:/Users/<YourName>/scoop/apps/python/current/pythonw.exe C:/Users/<YourName>/.config/yasb/scripts/obs_status.py --idle"
        run_interval: 1000
        return_format: "string"
        hide_empty: true
        use_shell: false
      callbacks:
        on_left: "exec C:/Users/<YourName>/scoop/apps/python/current/pythonw.exe C:/Users/<YourName>/.config/yasb/scripts/obs_action.py left"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  obs_rec:
    type: yasb.custom.CustomWidget
    options:
      class_name: "obs-rec"
      label: "{data}"
      label_alt: "{data}"
      label_placeholder: ""
      tooltip: true
      tooltip_label: "OBS {data}"
      exec_options:
        run_cmd: "C:/Users/<YourName>/scoop/apps/python/current/pythonw.exe C:/Users/<YourName>/.config/yasb/scripts/obs_status.py"
        run_interval: 1000
        return_format: "string"
        hide_empty: true
        use_shell: false
      callbacks:
        on_left: "exec C:/Users/<YourName>/scoop/apps/python/current/pythonw.exe C:/Users/<YourName>/.config/yasb/scripts/obs_action.py left"
        on_middle: "do_nothing"
        on_right: "exec C:/Users/<YourName>/scoop/apps/python/current/pythonw.exe C:/Users/<YourName>/.config/yasb/scripts/obs_action.py right"
