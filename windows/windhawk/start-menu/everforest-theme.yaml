# Everforest (High Contrast / hard, dark) theme for Windows 11 Start Menu Styler (redesigned 25H2)
# AUTO-GENERATED from Themes/themes/everforest/tokens.yaml — 不要手改，改 tokens 后跑 generate.py
# Based on sainnhe/everforest, hard/contrast = High, dark background.
# Import: Windhawk > Windows 11 Start Menu Styler > Settings > "Textual mode" > paste this.
#
# 范围（2026-11 定稿）：只做「背景色 + 透明化 + 描边」三件事。
#   文字色 / 圆角 / 悬停高光 / 图标色 / 按钮三态 —— 全部交回系统默认。
#   （那些定制在 git 历史里可查：2026-11 之前的 183 行版本）
#
# 参数与 YASB 状态栏对齐（说明见 src/notification.yaml 顶部）：
#   背景 #272e33 + Tint 0.45 + 亮度层 0.6（WindhawkBlur 不是系统亚克力，补参数见 src/notification.yaml）
#   描边 #374145（= 角色「浮层」，与 yasb 的 border-bottom 同色；绿色只留给 accent）
theme: ''
disableNewStartMenuLayout: ''
styleConstants:
  # 玻璃画刷：主面板 / 主页 / 应用列表 / 搜索页 / 文件夹浮层 / 右键菜单 共用这一个。
  # （曾试过把背景让给 DWM SystemBackdrop，本系统上不生效，见 src/windhawk-translucent.yaml 的注释）
  - GlassBrush=<AcrylicBrush TintColor="#272e33" TintOpacity="0.45" TintLuminosityOpacity="0.6" FallbackColor="#272e33"/>
controlStyles:
  # 主背景层（25H2 开始菜单实际生效的那层亚克力）+ 1px 描边
  # 背景由本文件的 $GlassBrush 负责（DWM SystemBackdrop 对开始菜单不生效，
  # 曾试过 translucent-windows 的 acrylicsystem，结果背景全透、没有模糊）。
  - target: Border#AcrylicBorder
    styles:
      - Background:=$GlassBrush
      - BorderBrush=#374145
      - BorderThickness=1
  # 官方主题同样是直接折叠这一层：设透明仍会被它在上面叠一层色调
  - target: Border#AcrylicOverlay
    styles:
      - Visibility=Collapsed
  # 主页背景层（系统的模糊原本挂在这一层）
  - target: Border#BorderElement
    styles:
      - Background:=$GlassBrush
  # 应用列表 / 详情页容器
  - target: Border#AppBorder
    styles:
      - Background:=$GlassBrush
  # 搜索页背景
  - target: Border#TaskbarSearchBackground
    styles:
      - Background:=$GlassBrush
      - BorderBrush=Transparent
  # 文件夹展开浮层
  - target: StartMenu.ExpandedFolderList > Grid > Border
    styles:
      - Background:=$GlassBrush
  # 搜索框：保持「最深」实色 —— 玻璃下方需要一层不透明底，
  # 否则输入区文字压在模糊上对比度不足（这是唯一非玻璃的填充）
  - target: StartMenu.SearchBoxToggleButton > Grid > Border
    styles:
      - Background=#1e2326
      - BorderBrush=transparent
  # 右键菜单：玻璃 + 1px 描边（亚克力浮层需要描边才「浮」得起来）
  - target: MenuFlyoutPresenter > Border
    styles:
      - Background:=$GlassBrush
      - BorderBrush=#374145
      - BorderThickness=1
  # 深色前景：保留这一条（RequestedTheme=2 = Dark）。
  # 删掉后开始菜单会跟随系统明暗 —— 浅色设置下变成黑字浅底，不是要的效果。
  - target: Grid
    styles:
      - RequestedTheme=2
