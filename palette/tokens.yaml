# ============================================================
# Everforest 角色表 —— 唯一权威（single source of truth）
# ============================================================
# 用法：源文件（src/）里写 {{名字}}，例如 Fill={{背景}}、color: {{强调}}
#       generate.py 把它替换成下面的色值。
#       {{名字_rgb}} 会展开成 "r, g, b"，供 rgba(...) 使用。
#
# 规则：
#   1. 只有 `dark` 一段（浅色 light 已于 2026-09 移除，别再按两套写）。
#   2. 名字对应「用途」而不是「色相」；要单独调某个用途，就在表里加一个新名字。
#   3. 色值来自 sainnhe/everforest 的 hard（高对比）档，行末括号里是上游色板名。
#
# 想整体调明暗：改「最深 / 背景 / 面板 / 浮层 / 边框」。
# 想换主题色：  改「强调 / 正常 / 注意 / 危险」。
# ============================================================

# ------------------------------------------------------------
# 暗色（唯一）
# ------------------------------------------------------------
dark:
  最深: '#1e2326'  # bg_dim      最暗底层（工具待执行框、Edge frame）
  背景: '#272e33'  # bg0         一级背景（内容区、主界面、文件列表、状态栏）
  面板: '#2e383c'  # bg1         二级面板（侧栏、导航、消息块、任务栏悬浮）
  浮层: '#374145'  # bg2         浮层/选中（按钮、缩略图、标签选中）
  边框: '#414b50'  # bg3         描边与边框
  加重: '#495156'  # bg4         更重的浮层（当前未使用，备用）
  正文: '#d3c6aa'  # fg          正文文字（界面正文 + 代码正文）
  次要: '#9da9a0'  # grey2       次要文字（工具输出、代码标点）
  更淡: '#859289'  # grey1       更淡文字（URL、占位符、悬停态）
  最淡: '#7a8478'  # grey0       最淡文字（未选中项、空状态）
  反色: '#2d353b'  # fg_on_green 强调色底上的文字
  强调: '#a7c080'  # green       主强调色（标题、选中、代码字符串）
  正常: '#83c092'  # aqua        正常/成功（也是代码里的类型色）
  注意: '#dbbc7f'  # yellow      警告（也是代码里的函数色）
  偏高: '#e69875'  # orange      偏高风险
  危险: '#e67e80'  # red         错误/危险（也是代码里的关键字色）
  蓝: '#7fbbb3'  # blue        代码变量色
  紫: '#d699b6'  # purple      代码数字色
  注释: '#7a8478'  # grey0       代码注释（比「最淡」再深一档，故独立命名）
